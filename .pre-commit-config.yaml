repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [core, sdk/python, mcp, integrations]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: dashboard-check
        name: Dashboard lint and typecheck
        entry: bash -c "cd dashboard && npm run check"
        language: system
        pass_filenames: false
        always_run: true
