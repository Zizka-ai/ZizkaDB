[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zizkadb-livekit"
version = "0.2.0"
description = "LiveKit Agents observer for ZizkaDB — one session per call, transcript from LiveKit (no audio stored)"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "zizkadb-sdk>=0.2.8",
    "livekit-agents>=1.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.urls]
Repository = "https://github.com/Zizka-ai/ZizkaDB"
Documentation = "https://db.zizka.ai/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["zizkadb_livekit*"]
